name: Build and validate

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu C++17 and local MPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenmpi-dev openmpi-bin python3
      - name: Build solver variants
        run: make -j2 v1 v2 v3 v4 v1_noavx v2_noavx
      - name: Run component tests
        run: timeout 180 make test_unit test_openmp_unit test_mpi_unit
      - name: Check returned rulers and known lengths
        run: python3 tests/check_cli.py
      - name: Check benchmark scripts
        run: |
          bash -n bench/run.sh
          python3 -m py_compile bench/measure.py bench/plot.py tests/check_cli.py
      - name: Preserve validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-validation
          path: build/validation/
